<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Padrão de nome de oferta</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Padrão de nome de oferta</h1>
  <p class="sub">Escolha uma tag por linha, de cima para baixo. A observação é opcional.</p>
  <section class="resultado" aria-live="polite">
    <small>Nome padrão</small>
    <div id="nome"></div>
    <div class="acoes">
      <button id="gerar" class="p" disabled>Gerar nome e Id</button>
      <button id="copiar" disabled>Copiar</button>
      <button id="limpar">Limpar</button>
    </div>
  </section>
  <div id="campos"></div>
  <fieldset class="obs">
    <legend><label for="obs">Observação (opcional)</label></legend>
    <input id="obs" maxlength="40" autocomplete="off" placeholder="Ex.: COCACOLA">
    <div class="aviso" id="aviso"></div>
  </fieldset>
  <h2>Nomes gerados neste navegador</h2>
  <button id="exportar">Exportar CSV</button>
  <table id="hist"><thead><tr><th>Nome</th><th>Gerado em</th></tr></thead><tbody></tbody></table>
</main>
<script src="dados.js"></script>
<script src="app.js"></script>
</body>
</html>
